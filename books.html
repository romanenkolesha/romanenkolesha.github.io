<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library Stack</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #111111;
            --font-main: 'Manrope', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: var(--font-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .book-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 900px;
        }

        .book {
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            
            width: var(--b-width);
            height: var(--b-height);
            background-color: var(--b-color);
            
            box-sizing: border-box; 
            overflow: hidden;
            white-space: nowrap; 
        }

        .book:hover {
            transform: scale(1.01);
            z-index: 10;
        }

        .book-title {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-right: 8px;
            transition: font-size 0.1s; 
        }

        .book-author {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.95;
            
            margin-left: auto;
            flex-shrink: 0;
            transition: font-size 0.1s;
        }

        /* Класс для скрытия автора, если не влезает */
        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .book {
                width: 95% !important;
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>

    <div class="book-stack" id="stackContainer"></div>

    <script>
        const booksData = [
            { title: "To Kill a Mockingbird", author: "Harper Lee", width: "65%", height: "60px", color: "#F4F1DE" },
            { title: "1984", author: "George Orwell", width: "50%", height: "50px", color: "#FF5733" },
            { title: "Pride and Prejudice", author: "Jane Austen", width: "70%", height: "65px", color: "#AECBEB" },
            { title: "The Great Gatsby", author: "F. Scott Fitzgerald", width: "45%", height: "55px", color: "#5D54A4" },
            { title: "One Hundred Years of Solitude", author: "G. García Márquez", width: "80%", height: "70px", color: "#1DB954" },
            { title: "Преступление и наказание", author: "Ф. Достоевский", width: "60%", height: "60px", color: "#333333" },
            { title: "Анна Каренина", author: "Лев Толстой", width: "55%", height: "58px", color: "#FB5607" },
            { title: "Мастер и Маргарита", author: "М. Булгаков", width: "75%", height: "62px", color: "#8338EC" },
            { title: "Евгений Онегин", author: "А. Пушкин", width: "40%", height: "45px", color: "#FEF9D3" }
        ];

        const container = document.getElementById('stackContainer');

        function createBookElement(data) {
            const bookDiv = document.createElement('div');
            bookDiv.className = 'book';
            
            bookDiv.style.setProperty('--b-width', data.width);
            bookDiv.style.setProperty('--b-height', data.height);
            bookDiv.style.setProperty('--b-color', data.color);
            
            const lightColors = ["#F4F1DE", "#AECBEB", "#FEF9D3"];
            const isLight = lightColors.includes(data.color);
            bookDiv.style.color = isLight ? "#111" : "#fff";

            const titleDiv = document.createElement('div');
            titleDiv.className = 'book-title';
            titleDiv.textContent = data.title;

            const authorDiv = document.createElement('div');
            authorDiv.className = 'book-author';
            authorDiv.textContent = data.author;

            bookDiv.appendChild(titleDiv);
            bookDiv.appendChild(authorDiv);

            container.appendChild(bookDiv);
            adjustFontSize(bookDiv, titleDiv, authorDiv);

            return bookDiv;
        }

        // Функция подгонки шрифта
        function adjustFontSize(book, title, author) {
            let fontSize = 16; // Начальный размер шрифта (пиксели)
            const minFontSize = 9; // Минимальный размер
            const paddingBuffer = 32; // Запас на отступы книги

            // 1. Попытка уменьшить шрифт, чтобы влезло всё (название + автор)
            while (fontSize >= minFontSize) {
                title.style.fontSize = `${fontSize}px`;
                author.style.fontSize = `${fontSize * 1.3}px`; // Автор всегда чуть крупнее

                const totalTextWidth = title.scrollWidth + author.scrollWidth + 8;
                const availableWidth = book.clientWidth - paddingBuffer;

                if (totalTextWidth <= availableWidth) {
                    return; // Влезло! Выходим.
                }

                fontSize--;
            }

            // 2. Если дошли до минимума и всё равно не влезает -> скрываем АВТОРА
            author.classList.add('hidden');
            
            // Название растягиваем на всю доступную ширину
            title.style.marginRight = '0';
            
            // Устанавливаем шрифт названия на минимальный комфортный
            title.style.fontSize = `${minFontSize}px`;
            
            // Финальная проверка для названия (если оно одно тоже не влезает, уменьшаем его)
            let titleSize = minFontSize;
            while (title.scrollWidth > (book.clientWidth - paddingBuffer) && titleSize > 7) {
                titleSize--;
                title.style.fontSize = `${titleSize}px`;
            }
        }

        function renderBooks() {
            container.innerHTML = '';
            booksData.forEach(book => {
                createBookElement(book);
            });
        }

        renderBooks();
        
        // Пересчет при изменении размера окна (поворот экрана)
        window.addEventListener('resize', () => {
            container.innerHTML = '';
            renderBooks();
        });

    </script>
</body>
</html>
